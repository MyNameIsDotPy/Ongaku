<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Onda · prototipo de la app</title>
  <link rel="stylesheet" href="app.css" />
  <style>
    .tracks.no-alb .row, .tracks.no-alb + .x, .list-head.no-alb { grid-template-columns: 32px minmax(0, 1fr) 72px 36px; }
    .tracks.no-alb .rb { display: none; }
    .tracks.editable .row, .list-head.editable { grid-template-columns: 32px minmax(0, 1fr) minmax(0, .8fr) 72px 36px 36px; }
    @media (max-width: 820px) { .tracks.no-alb .row { grid-template-columns: minmax(0, 1fr) auto 36px; } .tracks.editable .row { grid-template-columns: 28px minmax(0, 1fr) auto 36px 36px; } .tracks.editable .row .ix { display: grid; } }
  </style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-lib" viewBox="0 0 24 24"><path d="M5 4v16M9.5 4v16M14 4.5l5 15"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.4"/><circle cx="10" cy="17" r="2.4"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.8v14.4a1 1 0 0 0 1.5.86l12-7.2a1 1 0 0 0 0-1.72l-12-7.2A1 1 0 0 0 7 4.8z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1.3"/><rect x="14" y="4.5" width="4" height="15" rx="1.3"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 5.6v12.8a1 1 0 0 0 1.55.83L16 13v5.5a1 1 0 0 0 2 0v-13a1 1 0 0 0-2 0V11L6.55 4.77A1 1 0 0 0 5 5.6z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><g transform="translate(24 0) scale(-1 1)"><path d="M5 5.6v12.8a1 1 0 0 0 1.55.83L16 13v5.5a1 1 0 0 0 2 0v-13a1 1 0 0 0-2 0V11L6.55 4.77A1 1 0 0 0 5 5.6z"/></g></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 7h3.5c2 0 3.2 1 4.3 2.6l2.4 4.8C14.3 16 15.5 17 17.5 17H21M3 17h3.5c1.3 0 2.3-.5 3.1-1.3M14.4 8.3C15.2 7.5 16.2 7 17.5 7H21M18 4l3 3-3 3M18 14l3 3-3 3"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 11V9a3 3 0 0 1 3-3h13M17 3l3 3-3 3M20 13v2a3 3 0 0 1-3 3H4M7 21l-3-3 3-3"/></symbol>
    <symbol id="i-repeat1" viewBox="0 0 24 24"><path d="M4 11V9a3 3 0 0 1 3-3h13M17 3l3 3-3 3M20 13v2a3 3 0 0 1-3 3H4M7 21l-3-3 3-3M11 10.5l1.5-1v5"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.1A4.4 4.4 0 0 1 12 7.3a4.4 4.4 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/></symbol>
    <symbol id="i-queue" viewBox="0 0 24 24"><path d="M4 6h16M4 11h16M4 16h8M16 14.5v6l5-3z"/></symbol>
    <symbol id="i-lyrics" viewBox="0 0 24 24"><path d="M5 5h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-7l-4 3v-3H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM8 9.5h8M8 12.5h5"/></symbol>
    <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.5 1.5M10 3h4"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
    <symbol id="i-dl" viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-grip" viewBox="0 0 24 24"><circle cx="9" cy="6.5" r="1.4"/><circle cx="15" cy="6.5" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="17.5" r="1.4"/><circle cx="15" cy="17.5" r="1.4"/></symbol>
    <symbol id="i-radio" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
    <symbol id="i-album" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></symbol>
    <symbol id="i-off" viewBox="0 0 24 24"><path d="M3 3l18 18M8.5 16.5a5 5 0 0 1 7 0M5 12.5a10 10 0 0 1 5-2.6M14.5 10a10 10 0 0 1 4.5 2.5M2 9a15 15 0 0 1 4.5-2.8M10.5 5.1A15 15 0 0 1 22 9"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"/></symbol>
    <symbol id="i-battery" viewBox="0 0 24 24"><rect x="3" y="7" width="16" height="10" rx="2"/><path d="M21 10.5v3M6.5 10v4M10 10v4"/></symbol>
    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M3 12c2 0 2-5 4.5-5S10 17 12 17s2.5-10 4.5-10S19 12 21 12"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></symbol>
    <symbol id="i-pc" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></symbol>
    <filter id="liquify" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB"><feTurbulence id="liquify-noise" type="fractalNoise" baseFrequency="0.011 0.017" numOctaves="2" seed="7" result="n"/><feDisplacementMap id="liquify-map" in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter>
    <symbol id="i-retry" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v4.5h-4.5"/></symbol>
  </defs>
</svg>

<div class="app" id="app">
  <aside class="side" data-od-id="sidebar" aria-label="Navegación">
    <a class="brand" href="#/inicio" data-od-id="brand"><span class="brand-mark"><svg class="i"><use href="#i-wave"/></svg></span>Onda</a>
    <span class="nav-pill" aria-hidden="true"></span>
    <a class="nav-item" href="#/inicio" data-nav="inicio" data-od-id="nav-inicio"><svg class="i"><use href="#i-home"/></svg>Inicio</a>
    <a class="nav-item" href="#/buscar" data-nav="buscar" data-od-id="nav-buscar"><svg class="i"><use href="#i-search"/></svg>Buscar<span class="meta mono" style="margin-left:auto;font-size:11px">Ctrl F</span></a>
    <a class="nav-item" href="#/biblioteca" data-nav="biblioteca" data-od-id="nav-biblioteca"><svg class="i"><use href="#i-lib"/></svg>Biblioteca</a>
    <a class="nav-item" href="#/ajustes" data-nav="ajustes" data-od-id="nav-ajustes"><svg class="i"><use href="#i-gear"/></svg>Ajustes</a>
    <p class="eyebrow side-sec">Tus playlists</p>
    <div id="side-pls" data-od-id="sidebar-playlists"></div>
    <div class="side-foot"><span class="conn" id="conn" data-od-id="connection-indicator">Conectado · homelab</span></div>
  </aside>

  <main class="main" id="main" data-od-id="content">
    <div class="offline-banner" role="status" data-od-id="offline-banner"><svg class="i"><use href="#i-off"/></svg><span><b>Sin conexión al backend.</b> Tienes disponibles la biblioteca en caché y las descargas.</span><a class="link" href="#/ajustes" style="margin-left:auto">Revisar</a></div>
    <div id="view"></div>
  </main>

  <aside class="qpanel" data-od-id="queue-panel" aria-label="Cola"><div class="qpanel-in" id="qpanel"></div></aside>

  <footer class="bar" id="bar" data-od-id="player-bar">
    <button class="now" data-act="open-np" aria-label="Abrir reproductor" data-od-id="mini-now">
      <img id="bar-cover" src="" alt="" width="52" height="52" />
      <span style="min-width:0"><span class="tt" id="bar-title" style="display:block"></span><span class="ta" id="bar-artist" style="display:block"></span></span>
    </button>
    <div class="center">
      <div class="ctrls">
        <button class="icon-btn sm hide-m" data-act="shuffle" id="bar-shuffle" aria-label="Aleatorio"><svg class="i"><use href="#i-shuffle"/></svg></button>
        <button class="icon-btn hide-m" data-act="prev" aria-label="Anterior"><svg class="i fill"><use href="#i-prev"/></svg></button>
        <button class="play-btn hide-m" data-act="toggle" id="bar-play" aria-label="Reproducir" data-od-id="bar-play"></button>
        <button class="icon-btn hide-m" data-act="next" aria-label="Siguiente"><svg class="i fill"><use href="#i-next"/></svg></button>
        <button class="icon-btn sm hide-m" data-act="repeat" id="bar-repeat" aria-label="Repetir"><svg class="i"><use href="#i-repeat"/></svg></button>
      </div>
      <div class="seek"><span class="num" id="bar-pos">0:00</span><div class="track" id="bar-seek" role="slider" tabindex="0" aria-label="Progreso"><div class="rail"><div class="fill"></div></div><div class="knob"></div></div><span class="num" id="bar-dur">0:00</span></div>
      <div class="mini-prog" style="width:100%"><i id="mini-prog"></i></div>
    </div>
    <div class="right">
      <span class="eq hide-m" id="bar-eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <button class="icon-btn sm hide-m" data-act="fav-current" id="bar-fav" aria-label="Favorito"><svg class="i"><use href="#i-heart"/></svg></button>
      <button class="icon-btn sm hide-m" data-act="open-lyrics" aria-label="Letra"><svg class="i"><use href="#i-lyrics"/></svg></button>
      <button class="icon-btn sm hide-m" data-act="toggle-queue" id="bar-queue" aria-label="Cola"><svg class="i"><use href="#i-queue"/></svg></button>
      <button class="icon-btn" data-act="toggle" id="bar-play-m" aria-label="Reproducir" style="display:none"></button>
    </div>
  </footer>

  <nav class="tabbar" data-od-id="tabbar" aria-label="Navegación">
    <span class="tab-blob" aria-hidden="true"></span>
    <a href="#/inicio" data-nav="inicio"><svg class="i"><use href="#i-home"/></svg>Inicio</a>
    <a href="#/buscar" data-nav="buscar"><svg class="i"><use href="#i-search"/></svg>Buscar</a>
    <a href="#/biblioteca" data-nav="biblioteca"><svg class="i"><use href="#i-lib"/></svg>Biblioteca</a>
    <a href="#/ajustes" data-nav="ajustes"><svg class="i"><use href="#i-gear"/></svg>Ajustes</a>
  </nav>
</div>

<section class="np" id="np" data-mode="cover" aria-label="Reproductor" aria-hidden="true" data-od-id="now-playing">
  <canvas class="aura" id="aura" aria-hidden="true"></canvas>
  <div class="np-in">
    <header class="np-head">
      <button class="icon-btn" data-act="close-np" aria-label="Cerrar reproductor" data-od-id="np-close"><svg class="i"><use href="#i-down"/></svg></button>
      <div class="from"><span class="eyebrow" style="color:var(--muted)">Reproduciendo desde</span><b id="np-from">Cola</b></div>
      <button class="icon-btn" data-act="np-menu" aria-label="Más opciones"><svg class="i fill"><use href="#i-more"/></svg></button>
    </header>
    <div class="np-tabs"><div class="seg" id="np-seg" role="group" aria-label="Vista"><span class="thumb"></span><button data-mode="cover" aria-pressed="true">Portada</button><button data-mode="lyrics" aria-pressed="false">Letra</button><button data-mode="queue" aria-pressed="false">Cola</button></div></div>
    <div class="stage" data-od-id="np-stage">
      <div class="art-col">
        <div class="big-cover" id="np-cover-wrap"><img id="np-cover" src="" alt="" width="600" height="600" /></div>
        <div class="meta-line">
          <div style="min-width:0"><h2 id="np-title"></h2><a id="np-artist" href="#/"></a></div>
          <button class="icon-btn" data-act="fav-current" id="np-fav" aria-label="Favorito"><svg class="i"><use href="#i-heart"/></svg></button>
        </div>
      </div>
      <div class="side-col">
        <div class="lyr-wrap" id="lyr-wrap" data-od-id="np-lyrics">
          <div class="lyr-tags"><span class="tag" id="lyr-kind">Sincronizada</span><span class="tag">Letra de muestra</span></div>
          <div class="lyr" id="lyr"></div>
        </div>
        <div class="np-queue" id="np-queue" data-od-id="np-queue"></div>
      </div>
    </div>
    <div class="np-ctrl" data-od-id="np-controls">
      <div class="err-note" id="np-note" role="status"></div>
      <div class="seek"><span class="num" id="np-pos">0:00</span><div class="track" id="np-seek" role="slider" tabindex="0" aria-label="Progreso"><div class="rail"><div class="fill"></div></div><div class="knob"></div></div><span class="num" id="np-dur">0:00</span></div>
      <div class="np-btns">
        <div class="l">
          <button class="icon-btn hide-m" data-act="np-mode" data-mode="lyrics" id="np-lyr-btn" aria-label="Letra"><svg class="i"><use href="#i-lyrics"/></svg></button>
          <button class="icon-btn hide-m" data-act="np-mode" data-mode="queue" id="np-q-btn" aria-label="Cola"><svg class="i"><use href="#i-queue"/></svg></button>
        </div>
        <div class="np-main">
          <button class="icon-btn" data-act="shuffle" id="np-shuffle" aria-label="Aleatorio"><svg class="i"><use href="#i-shuffle"/></svg></button>
          <button class="icon-btn" data-act="prev" aria-label="Anterior"><svg class="i fill"><use href="#i-prev"/></svg></button>
          <button class="np-play" data-act="toggle" id="np-play" aria-label="Reproducir" data-od-id="np-play"></button>
          <button class="icon-btn" data-act="next" aria-label="Siguiente"><svg class="i fill"><use href="#i-next"/></svg></button>
          <button class="icon-btn" data-act="repeat" id="np-repeat" aria-label="Repetir"><svg class="i"><use href="#i-repeat"/></svg></button>
        </div>
        <div class="r">
          <button class="icon-btn hide-m" data-act="timer" id="np-timer" aria-label="Temporizador de apagado"><svg class="i"><use href="#i-timer"/></svg></button>
        </div>
      </div>
    </div>
  </div>
</section>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="liquid.js"></script>
<script src="app.js"></script>
<script src="np.js"></script>
</body>
</html>
